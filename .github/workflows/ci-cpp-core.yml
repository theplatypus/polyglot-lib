name: ci-cpp-core

on:
  push:
    branches: [cpp-core]
  pull_request:

jobs:
  cmake-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S cpp -B cpp/build -DMYLIB_BUILD_PYTHON=OFF
      - name: Build
        run: cmake --build cpp/build --config Release
      - name: Test
        run: ctest --test-dir cpp/build --output-on-failure

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: python -m pip install --upgrade pip numpy pytest
      - name: Build wheel from cpp/pybind
        run: python -m pip wheel ./cpp/pybind -w wheelhouse
      - name: Install mylib_cpp wheel + examples package
        run: |
          python -m pip install --no-index --find-links wheelhouse mylib-cpp
          python -m pip install -e "examples/python[dev]"
      - name: Run pytest
        run: pytest -q examples/python/tests

  emscripten:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - name: Build wasm artifacts
        run: ./cpp/wasm/build.sh

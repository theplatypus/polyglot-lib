name: release-rust-core

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: mylib
  PY_MANIFEST_PATH: crates/py/Cargo.toml
  C_ABI_PACKAGE: mylib-c-abi
  WASM_CRATE_DIR: crates/wasm
  HEADERS_DIR: include

jobs:
  checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  build-wheels:
    name: Wheels (${{ matrix.asset_os }}-${{ matrix.asset_arch }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            asset_arch: x86_64
            use_manylinux: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_os: linux
            asset_arch: aarch64
            use_manylinux: true
          # - os: macos-13
          #   target: x86_64-apple-darwin
          #   asset_os: macos
          #   asset_arch: x86_64
          #   use_manylinux: false
          - os: macos-14
            target: aarch64-apple-darwin
            asset_os: macos
            asset_arch: arm64
            use_manylinux: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: x86_64
            use_manylinux: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build manylinux wheel with maturin
        if: matrix.use_manylinux
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --manifest-path ${{ env.PY_MANIFEST_PATH }} --out dist -i python3.10

      - name: Build wheel with maturin
        if: ${{ !matrix.use_manylinux }}
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          args: --release --manifest-path ${{ env.PY_MANIFEST_PATH }} --out dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/*.whl
          if-no-files-found: error

  test-python-wheel:
    name: Python tests (wheel install, py${{ matrix.python-version }})
    needs: build-wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download Linux wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: wheelhouse

      - name: Install wheel + test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links wheelhouse mylib-rs
          python -m pip install -e "examples/python[dev]"

      - name: Run pytest against examples/python/tests
        run: pytest -q examples/python/tests

  build-wasm:
    name: WASM bundle
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ env.WASM_CRATE_DIR }}

      - name: Setup wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build wasm package (bundler target)
        run: wasm-pack build ${{ env.WASM_CRATE_DIR }} --target bundler --out-dir pkg --release

      - name: Archive wasm package
        shell: bash
        run: |
          mkdir -p dist
          (
            cd ${{ env.WASM_CRATE_DIR }}
            zip -r "../../dist/${{ env.PROJECT_NAME }}-${{ steps.meta.outputs.version }}-wasm-pkg.zip" pkg
          )

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-bundle
          path: dist/*-wasm-pkg.zip
          if-no-files-found: error

  bundle-headers:
    name: Header bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive C/C++ headers
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/${{ env.PROJECT_NAME }}-${{ steps.meta.outputs.version }}-headers.zip" ${{ env.HEADERS_DIR }}

      - name: Upload headers artifact
        uses: actions/upload-artifact@v4
        with:
          name: headers-bundle
          path: dist/*-headers.zip
          if-no-files-found: error

  build-native-libs:
    name: Native lib (${{ matrix.asset_os }}-${{ matrix.asset_arch }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_os: linux
            asset_arch: x86_64
          # - os: macos-13
          #   asset_os: macos
          #   asset_arch: x86_64
          - os: macos-latest
            asset_os: macos
            asset_arch: arm64
          - os: windows-latest
            asset_os: windows
            asset_arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build C ABI shared library
        run: cargo build --release -p ${{ env.C_ABI_PACKAGE }}

      - name: Collect and archive native libraries
        shell: pwsh
        run: |
          $project = "${{ env.PROJECT_NAME }}"
          $version = "${{ steps.meta.outputs.version }}"
          $assetOs = "${{ matrix.asset_os }}"
          $assetArch = "${{ matrix.asset_arch }}"
          $releaseDir = Join-Path $PWD "target/release"
          $collectDir = Join-Path $PWD "dist/native"
          New-Item -ItemType Directory -Force -Path $collectDir | Out-Null

          if ("${{ runner.os }}" -eq "Linux") {
            $patterns = @("libmylib.so", "libmylib.a")
          } elseif ("${{ runner.os }}" -eq "macOS") {
            $patterns = @("libmylib.dylib", "libmylib.a")
          } else {
            $patterns = @("mylib.dll", "mylib.lib")
          }

          foreach ($pattern in $patterns) {
            Get-ChildItem -Path $releaseDir -Filter $pattern -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item $_.FullName -Destination $collectDir -Force
            }
          }

          if ((Get-ChildItem -Path $collectDir -File | Measure-Object).Count -eq 0) {
            throw "No native library artifacts were found in $releaseDir"
          }

          $zipPath = Join-Path $PWD "dist/$project-$version-$assetOs-$assetArch-native.zip"
          Compress-Archive -Path (Join-Path $collectDir "*") -DestinationPath $zipPath -Force

      - name: Upload native library artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/*-native.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-wheels
      - test-python-wheel
      - build-wasm
      - bundle-headers
      - build-native-libs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          ls -lah dist
          compgen -G "dist/*.whl" >/dev/null
          compgen -G "dist/*-wasm-pkg.zip" >/dev/null
          compgen -G "dist/*-headers.zip" >/dev/null
          compgen -G "dist/*-native.zip" >/dev/null

      - name: Create or update release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            dist/*.whl
            dist/*-wasm-pkg.zip
            dist/*-headers.zip
            dist/*-native.zip

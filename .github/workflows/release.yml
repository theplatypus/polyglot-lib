name: release-cpp-core

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT_NAME: mylib
  PY_PACKAGE_DIR: cpp/pybind
  HEADERS_DIR: include

jobs:
  checks:
    name: C++ checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S cpp -B cpp/build -DMYLIB_BUILD_PYTHON=OFF

      - name: Build C++ targets
        run: cmake --build cpp/build --config Release

      - name: Run unit tests
        run: ctest --test-dir cpp/build --output-on-failure

  build-wheels:
    name: Wheels (${{ matrix.asset_os }}-${{ matrix.asset_arch }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_os: linux
            asset_arch: x86_64
            cibw_archs: x86_64
          - os: ubuntu-24.04-arm
            asset_os: linux
            asset_arch: aarch64
            cibw_archs: aarch64
          # - os: macos-13
          #   asset_os: macos
          #   asset_arch: x86_64
          #   cibw_archs: x86_64
          - os: macos-14
            asset_os: macos
            asset_arch: arm64
            cibw_archs: arm64
          - os: windows-latest
            asset_os: windows
            asset_arch: x86_64
            cibw_archs: AMD64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build wheels with cibuildwheel
        uses: pypa/cibuildwheel@v2.22.0
        with:
          package-dir: ${{ env.PY_PACKAGE_DIR }}
          output-dir: dist/wheels
        env:
          CIBW_BUILD: cp310-* cp311-* cp312-*
          CIBW_SKIP: pp* *-musllinux_* *-win32
          CIBW_ARCHS: ${{ matrix.cibw_archs }}
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: >
            python -c "import mylib_cpp; assert mylib_cpp.add(2.0, 3.0) == 5.0"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/wheels/*.whl
          if-no-files-found: error

  test-python-wheel:
    name: Python tests (wheel install, py${{ matrix.python-version }})
    needs: build-wheels
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download Linux wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: wheelhouse

      - name: Install wheel + test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-index --find-links wheelhouse --no-deps mylib-cpp
          python -m pip install -e "examples/python[dev]"

      - name: Run pytest against examples/python/tests
        run: pytest -q examples/python/tests

  build-wasm:
    name: WASM bundle
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          actions-cache-folder: emsdk-cache

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build wasm output
        run: ./cpp/wasm/build.sh

      - name: Archive wasm output
        shell: bash
        run: |
          mkdir -p dist
          (
            cd cpp/wasm/build
            zip -r "../../../dist/${{ env.PROJECT_NAME }}-${{ steps.meta.outputs.version }}-wasm-pkg.zip" .
          )

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: wasm-bundle
          path: dist/*-wasm-pkg.zip
          if-no-files-found: error

  bundle-headers:
    name: Header bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive headers
        shell: bash
        run: |
          mkdir -p dist
          zip -r "dist/${{ env.PROJECT_NAME }}-${{ steps.meta.outputs.version }}-headers.zip" include cpp/include

      - name: Upload headers artifact
        uses: actions/upload-artifact@v4
        with:
          name: headers-bundle
          path: dist/*-headers.zip
          if-no-files-found: error

  build-native-libs:
    name: Native lib (${{ matrix.asset_os }}-${{ matrix.asset_arch }})
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_os: linux
            asset_arch: x86_64
          - os: ubuntu-24.04-arm
            asset_os: linux
            asset_arch: aarch64
          # - os: macos-13
          #   asset_os: macos
          #   asset_arch: x86_64
          - os: macos-latest
            asset_os: macos
            asset_arch: arm64
          - os: windows-latest
            asset_os: windows
            asset_arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=manual-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure CMake
        run: cmake -S cpp -B cpp/build -DMYLIB_BUILD_PYTHON=OFF

      - name: Build native libraries
        run: cmake --build cpp/build --config Release --target mylib_c_api mylib_core

      - name: Collect and archive native libs
        shell: pwsh
        run: |
          $project = "${{ env.PROJECT_NAME }}"
          $version = "${{ steps.meta.outputs.version }}"
          $assetOs = "${{ matrix.asset_os }}"
          $assetArch = "${{ matrix.asset_arch }}"
          $buildDir = Join-Path $PWD "cpp/build"
          $releaseDir = Join-Path $buildDir "Release"
          $collectDir = Join-Path $PWD "dist/native"
          New-Item -ItemType Directory -Force -Path $collectDir | Out-Null

          $patterns = @(
            "*mylib_c_api*.so",
            "*mylib_c_api*.dylib",
            "*mylib_c_api*.dll",
            "*mylib_c_api*.a",
            "*mylib_c_api*.lib",
            "*mylib_core*.so",
            "*mylib_core*.dylib",
            "*mylib_core*.dll",
            "*mylib_core*.a",
            "*mylib_core*.lib"
          )

          $searchRoots = @($buildDir, $releaseDir)
          foreach ($root in $searchRoots) {
            if (Test-Path $root) {
              foreach ($pattern in $patterns) {
                Get-ChildItem -Path $root -Filter $pattern -File -ErrorAction SilentlyContinue | ForEach-Object {
                  Copy-Item $_.FullName -Destination $collectDir -Force
                }
              }
            }
          }

          if ((Get-ChildItem -Path $collectDir -File | Measure-Object).Count -eq 0) {
            throw "No native library artifacts were found in cpp/build"
          }

          $zipPath = Join-Path $PWD "dist/$project-$version-$assetOs-$assetArch-native.zip"
          Compress-Archive -Path (Join-Path $collectDir "*") -DestinationPath $zipPath -Force

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.asset_os }}-${{ matrix.asset_arch }}
          path: dist/*-native.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-wheels
      - test-python-wheel
      - build-wasm
      - bundle-headers
      - build-native-libs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          ls -lah dist
          compgen -G "dist/*.whl" >/dev/null
          compgen -G "dist/*-wasm-pkg.zip" >/dev/null
          compgen -G "dist/*-headers.zip" >/dev/null
          compgen -G "dist/*-native.zip" >/dev/null

      - name: Create or update release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          overwrite_files: true
          files: |
            dist/*.whl
            dist/*-wasm-pkg.zip
            dist/*-headers.zip
            dist/*-native.zip

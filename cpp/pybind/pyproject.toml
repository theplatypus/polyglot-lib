[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "mylib-cpp"
version = "0.1.0"
description = "pybind11 bindings for polyglot_lib cpp-core branch"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = []
